<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Era - Laboratory of Perfection</title>
    <style>
        /* 1. Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b1517; /* Dark cybernetic slate background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 2. Cybernetic Background Artwork Video Styling */
        .bg-artwork {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Filter matches the cool, desaturated cyan grade of the sample image */
            filter: brightness(0.65) contrast(1.1) saturate(0.85);
        }

        /* 3. Top Navigation Layout */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Brutalist Title Styling */
        .branding-group {
            color: #ffffff;
        }

        .main-logo {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 0.85;
            text-transform: lowercase;
            font-family: Arial, sans-serif; /* Fallback for heavy structural look */
        }

        .sub-logo {
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin-top: 10px;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Top Menu & Interactive Hover Items */
        .top-nav {
            display: flex;
            gap: 40px;
            padding-top: 20px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0.5;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            padding-bottom: 4px;
        }

        /* Interactive Hover Highlight States */
        .nav-link:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Decorative animated line below links */
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Secondary Header Right Block (Brutalist Symmetry) */
        .right-branding {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 0.85;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* 4. Bottom Section & Frosted Button Container */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 60px; /* Shifts the action zone upward */
        }

        /* Frosted Glass Pill Button */
        .cta-btn {
            background: rgba(255, 255, 255, 0.03); 
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 22px 80px;
            border-radius: 50px; /* Clean pill shape */
            border: 1px solid rgba(255, 255, 255, 0.25);
            
            /* Glassmorphism/Frosted Core Properties */
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            text-align: center;
        }

        /* Frosted Button Hover Animation */
        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px 0 rgba(255, 255, 255, 0.1), 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
            letter-spacing: 4px;
        }

        .cta-btn:active {
            transform: scale(0.99);
        }

        /* Responsive Layout Optimization */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .top-nav {
                width: 100%;
                justify-content: space-between;
                gap: 10px;
            }
            .right-branding {
                display: none; /* Hide secondary structural text on small mobile viewports */
            }
            .cta-btn {
                width: 90%;
                padding: 18px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Video: Replace paths with your video files -->
    <video class="bg-artwork" autoplay muted loop playsinline poster="fallback-image.jpg">
        <source src="background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Top Layout: Branding & Interactive Top Menu Headers -->
    <header>
        <div class="branding-group">
            <h1 class="main-logo">new</h1>
            <p class="sub-logo">Laboratory of perfection</p>
        </div>

        <nav class="top-nav">
            <a href="#about" class="nav-link">about</a>
            <a href="#technologies" class="nav-link">technologies</a>
            <a href="#services" class="nav-link">services</a>
            <a href="#team" class="nav-link">team</a>
        </nav>

        <div class="right-branding">
            <span>era</span>
        </div>
    </header>

    <!-- Center/Bottom Layout: Glassmorphic Floating Button Trigger -->
    <main>
        <a href="#book" class="cta-btn">Book Your Transformation</a>
    </main>
