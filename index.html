<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip's Trip<3 </title>
    <style>
        /* 1. Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b1517; /* Dark cybernetic slate background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

       /* 2. Cybernetic Background Video Styling */
.bg-artwork {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    background: #0b1517;
    display: block;
}

        /* 3. Top Navigation Layout */
        header {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Brutalist Title Styling */
        .branding-group {
            color: #ffffff;
        }

        .main-logo {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 0.85;
            text-transform: lowercase;
            font-family: Arial, sans-serif; /* Fallback for heavy structural look */
        }

        .sub-logo {
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin-top: 10px;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Top Menu & Interactive Hover Items */
        .top-nav {
            display: flex;
            gap: 40px;
            padding-top: 20px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0.5;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            padding-bottom: 4px;
        }

        /* Interactive Hover Highlight States */
        .nav-link:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Decorative animated line below links */
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: #ffffff;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Secondary Header Right Block (Brutalist Symmetry) */
        .right-branding {
            font-size: clamp(3.5rem, 8vw, 6rem);
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 0.85;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* 4. Bottom Section & Frosted Button Container */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 60px; /* Shifts the action zone upward */
        }

        /* Frosted Glass Pill Button */
        .cta-btn {
            background: rgba(255, 255, 255, 0.03); 
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 22px 80px;
            border-radius: 50px; /* Clean pill shape */
            border: 1px solid rgba(255, 255, 255, 0.25);
            
            /* Glassmorphism/Frosted Core Properties */
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            text-align: center;
        }

        /* Frosted Button Hover Animation */
        .cta-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 40px 0 rgba(255, 255, 255, 0.1), 0 0 20px rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
            letter-spacing: 4px;
        }

        .cta-btn:active {
            transform: scale(0.99);
        }

        /* 5. Frosted Glass Overlay */
        .frosted-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 21, 23, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .overlay-content {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            cursor: pointer;
            user-select: none;
        }

        /* 6. Hidden SoundCloud Player */
        #soundcloudPlayer {
            display: none;
        }

        /* Responsive Layout Optimization */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .top-nav {
                width: 100%;
                justify-content: space-between;
                gap: 10px;
            }
            .right-branding {
                display: none; /* Hide secondary structural text on small mobile viewports */
            }
            .cta-btn {
                width: 90%;
                padding: 18px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
  <!-- Background Video -->
    <video class="bg-artwork" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

<!-- Start of the Header -->
    <header>
        <a href="#" class="main-logo">
            <video class="logo-video" autoplay loop muted playsinline width="150" height="150">
                <source src="logo.webm" type="video/webm">
                Your browser does not support HTML5 video.
            </video>
        </a>
        <div class="branding-group">
            <div class="sub-logo"></div>
        </div>
        <nav class="top-nav">
            <a href="#" class="nav-link">HOME</a>
            <a href="#" class="nav-link">ABOUT</a>
            <a href="#" class="nav-link">PROJECTS</a>
            <a href="#" class="nav-link">CONTACT</a>
        </nav>
        <div class="right-branding">new era</div>
    </header>
    <!-- End of the Header -->
    <!-- Frosted Glass Overlay -->
    <div class="frosted-overlay" id="frostedOverlay">
        <div class="overlay-content" id="overlayText">Click to Enter...</div>
    </div>

    <!-- Center/Bottom Layout: Glassmorphic Floating Button Trigger -->
<main>
    <div style="margin-top: 300px;"> <!-- Adjust the margin-top value as needed -->
        <a href="#HOME" class="cta-btn">Enter here...</a>
    </div>
</main>

    <!-- Hidden SoundCloud Player -->
    <div id="soundcloudPlayer">
        <iframe
            width="100%"
            height="166"
            scrolling="no"
            frameborder="no"
            allow="autoplay; encrypted-media"
            src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1829707320&color=%23ff5500&auto_play=true&muted=true&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
        </iframe>
    </div>

    <!-- JavaScript to handle overlay click and autoplay -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const overlay = document.getElementById("frostedOverlay");
            const soundcloudPlayer = document.getElementById("soundcloudPlayer");
            const video = document.querySelector('.bg-artwork');

            // Log video events for debugging
            console.log('Video element found:', video);
            console.log('Video source:', video.querySelector('source').src);

            video.addEventListener('loadstart', () => console.log('Video: loadstart'));
            video.addEventListener('loadeddata', () => console.log('Video: loadeddata'));
            video.addEventListener('canplay', () => console.log('Video: canplay'));
            video.addEventListener('error', (e) => console.error('Video error:', e));

            // Click event to remove overlay and start music
            overlay.addEventListener("click", function() {
                overlay.style.opacity = "0";
                overlay.style.pointerEvents = "none";
                soundcloudPlayer.style.display = "block";

                // Start the SoundCloud player after a short delay to ensure the overlay is hidden
                setTimeout(function() {
                    const iframe = soundcloudPlayer.querySelector("iframe");
                    if (iframe) {
                        iframe.src = iframe.src.replace("muted=true", "muted=false");
                    }
                }, 500);
            });

            // Optional: Remove overlay if user presses any key
            document.addEventListener("keydown", function(e) {
                if (e.key === "Enter" || e.key === " ") {
                    overlay.style.opacity = "0";
                    overlay.style.pointerEvents = "none";
                    soundcloudPlayer.style.display = "block";

                    setTimeout(function() {
                        const iframe = soundcloudPlayer.querySelector("iframe");
                        if (iframe) {
                            iframe.src = iframe.src.replace("muted=true", "muted=false");
                        }
                    }, 500);
                }
            });
        });
    </script>
</body>
</html>
